name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Build and test
        shell: pwsh
        run: ./windows/build.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: WhisperKey-Windows-x64
          path: windows/dist/WhisperKey-Windows-x64-*.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          windows/dist/WhisperKey-Windows-x64-*.zip
          --title "WhisperKey for Windows $env:GITHUB_REF_NAME"
          --generate-notes
          --target $env:GITHUB_SHA
